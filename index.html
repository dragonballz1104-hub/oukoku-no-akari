<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>王国の灯 - モンスターバトル</title>
<style>
:root{--bg:#e4ead2;--panel:#f5f8e8;--ink:#1d2a1f;--line:#1d2a1f;--acc:#c2412d;--hp:#3a9a3a;--hpl:#d4b020;--hpd:#c2412d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2e;--panel:#1f2745;--ink:#e8ecff;--line:#8fa0e0;--acc:#c93c20;--hp:#4cc04c;--hpl:#e0c030;--hpd:#ff6a4a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a2e;--panel:#1f2745;--ink:#e8ecff;--line:#8fa0e0;--acc:#c93c20;--hp:#4cc04c;--hpl:#e0c030;--hpd:#ff6a4a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}
#app{max-width:480px;height:100%;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:8px}
h1{font-size:18px;margin:0}
#top{font-size:13px;border:2px solid var(--line);padding:6px 8px;background:var(--panel)}
#field{flex:1;display:flex;flex-direction:column;justify-content:space-around;min-height:0}
.side{display:flex;align-items:center;justify-content:space-between;gap:10px}
#me{flex-direction:row-reverse}
.info{flex:1;border:2px solid var(--line);background:var(--panel);padding:8px;font-size:15px;box-shadow:3px 3px 0 var(--line)}
.bar{height:10px;border:2px solid var(--line);margin:6px 0 3px;background:var(--bg)}
.bar i{display:block;height:100%;transition:width .4s}
canvas{image-rendering:pixelated;display:block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.evo{animation:evo .5s 3}@keyframes evo{50%{filter:brightness(8)}}
.spr{transition:opacity .5s}
.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.hit,.evo,canvas{animation:none}}
#msg{border:2px solid var(--line);background:var(--panel);padding:10px;min-height:4.6em;font-size:16px;line-height:1.5}
#menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:16px;padding:12px 6px;border:2px solid var(--line);background:var(--acc);color:#fff;box-shadow:3px 3px 0 var(--line);touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
button small{display:block;font-size:11px;opacity:.85}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wide,#menu button:only-child{grid-column:1/-1}
.wide{background:var(--panel);color:var(--ink)}
#world{flex:1;display:none;flex-direction:column;align-items:center;justify-content:space-around;min-height:0}
#map{animation:none;max-width:100%;height:auto;border:2px solid var(--line)}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{padding:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pad button:nth-child(5){grid-area:1/3;font-size:12px}#pad button:nth-child(6){grid-area:1/1;font-size:12px}
h1{display:flex;justify-content:space-between;align-items:center}#snd{padding:2px 10px;font-size:13px}
#msg{white-space:pre-line}#menu{max-height:38vh;overflow-y:auto}
#pad button:nth-child(1){grid-area:1/2}#pad button:nth-child(2){grid-area:2/1}#pad button:nth-child(3){grid-area:2/3}#pad button:nth-child(4){grid-area:2/2}
#cinema{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 65%,#182d3d 0%,#080b18 70%);color:#f8e9bd;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
#cinema:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#ffffff05 4px 5px);pointer-events:none}
#cinema .scene{width:min(440px,100%);animation:appear .8s ease both;position:relative}
#cinema .studio{font:700 clamp(27px,8vw,44px) Georgia,serif;letter-spacing:.13em;color:#fff5d2;text-shadow:0 0 12px #e5b65e,0 0 35px #c88c34}
#cinema .logo{font-size:clamp(48px,14vw,76px);font-weight:bold;letter-spacing:.12em;color:#fff1bd;text-shadow:0 3px #805525,0 0 25px #d58d32}
#cinema .sub{color:#a6b9cb;letter-spacing:.24em;font-size:12px;margin:18px 0}
#cinema .story{font-size:16px;line-height:2.1;text-align:left;white-space:pre-line;min-height:180px}
#cinema button{background:linear-gradient(#b98740,#6b4022);border:1px solid #e7c47b;color:#fff8dc;box-shadow:0 0 15px #c9974533;margin-top:25px;min-width:160px}
@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#cinema .scene{animation:none}}
#menu.dex-gallery{grid-template-columns:repeat(2,minmax(0,1fr));max-height:48vh;gap:7px}#menu .dex-card{background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;padding:7px 2px;font-size:12px}#menu .dex-card strong{font-size:12px;overflow-wrap:anywhere}#menu .dex-card small{font-size:11px}#menu .dex-sprite{animation:none;max-width:90px;max-height:90px}#menu .dex-evolution{grid-column:1/-1;display:flex;gap:3px;overflow-x:auto;align-items:center;justify-content:flex-start;padding:8px 3px;background:var(--panel);border:2px solid var(--line)}.dex-stage{flex:1;min-width:82px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:11px;text-align:center}.dex-stage canvas{animation:none;max-width:100%;height:auto}.dex-stage small{font-size:10px}#msg{max-height:24vh;overflow-y:auto}

/* 王国の灯 HD-2D風バトル＆UI */
:root{--bg:#080e19;--panel:#0a101c;--ink:#f7efd8;--line:#bd8b44;--acc:#172c47;--hp:#49c9a0;--hpl:#d6aa3b;--hpd:#e95a50;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080e19;--panel:#0a101c;--ink:#f7efd8;--line:#bd8b44;--acc:#172c47;--hp:#49c9a0;--hpl:#d6aa3b;--hpd:#e95a50}}
html,body{background:radial-gradient(ellipse at 50% 10%,#26344b,#060b14 70%);color:#f7efd8}
#app{max-width:620px;padding:8px;gap:7px}
h1{color:#ffe5a2;text-shadow:0 0 12px #ed9d35;font-size:21px;letter-spacing:.08em}
#top,#msg,.info{border:2px solid #c69a55;background:linear-gradient(145deg,#111a2bea,#030810f5);color:#f8f0d9;box-shadow:inset 0 0 0 1px #55402a,0 3px 12px #0009;border-radius:4px}
#top{font-size:11px;padding:7px}
#field{position:relative;isolation:isolate;min-height:260px;overflow:hidden;flex:1.5;justify-content:space-between;border:3px ridge #b78b4a;border-radius:5px;background-color:#4b6652;background-position:center;background-size:cover;box-shadow:inset 0 0 45px #0007,0 0 20px #0009}
#field:after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0002 0%,transparent 45%,#05070866 100%);pointer-events:none}
#field .side{position:absolute;display:flex;gap:0;align-items:center;justify-content:center}
#foe{right:1%;top:7%;width:60%;height:58%;flex-direction:column-reverse}
#me{left:0;bottom:0;width:57%;height:56%;flex-direction:column-reverse}
#field .spr{position:relative;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 12px 5px #0009)}
#field .spr:after{content:'';position:absolute;bottom:5%;width:64%;height:12%;background:#0006;border-radius:50%;z-index:-1;filter:blur(5px)}
#foe .spr canvas{width:clamp(128px,36vw,202px)!important;height:clamp(128px,36vw,202px)!important;max-width:100%}
#me .spr canvas{width:clamp(94px,28vw,145px)!important;height:clamp(94px,28vw,145px)!important;max-width:100%;transform:scaleX(-1) rotate(-3deg);filter:brightness(.88)}
/* 味方モンスターは常に相手の方向を向き、回転・上下動しない */
#me .spr canvas{animation:none!important;transform:scaleX(-1)!important;transform-origin:center center}
#field .info{position:absolute;z-index:2;font-size:11px;padding:5px 7px;line-height:1.25;min-width:130px;max-width:100%;box-shadow:0 2px 6px #0009}
#foe .info{top:0;right:0}#me .info{bottom:0;left:0}
#field .info b{color:#ffe3a0}.bar{height:8px;margin:4px 0 2px;background:#24272b;border:1px solid #9b865f}
#msg{font-size:14px;min-height:3.7em;padding:9px;line-height:1.55}
#menu{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:31vh}
button{background:linear-gradient(#213b57,#09172a);border:1px solid #c19a60;border-radius:3px;box-shadow:inset 0 0 0 1px #263c52,2px 2px 0 #05080e;color:#f8efd9;text-shadow:0 1px 2px #000;font-size:14px;padding:9px 5px}
button:active{background:#32597c}button:focus-visible{outline:2px solid #75d8ff}
button small{font-size:11px;color:#f0c97f}
.wide{background:linear-gradient(#313b45,#121922);color:#f9efd9}
#world{background:radial-gradient(ellipse at center,#263d2c,#0c1420);border:2px solid #b78b4a;border-radius:4px;padding:5px}
#map{border:3px ridge #c69a55;box-shadow:0 0 18px #000b;width:min(100%,380px);height:auto}
#pad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,42px);gap:4px}
#pad button{background:linear-gradient(#354862,#152239)}
#cinema{background:radial-gradient(ellipse at 50% 65%,#28485b 0%,#071126 60%,#02040a 100%)}
#cinema .logo{color:#ffe3a1;text-shadow:0 3px #804015,0 0 35px #ff8d22,0 0 70px #bd4d1c}
#menu.dex-gallery{max-height:43vh}#menu .dex-card{background:linear-gradient(#142338,#080e18);color:#f6e8ca}
#menu .dex-evolution{background:#0b1524}
@media(max-height:690px){#field{min-height:190px}#foe .spr canvas{width:125px!important;height:125px!important}#me .spr canvas{width:98px!important;height:98px!important}#menu{max-height:27vh}#msg{min-height:2.8em}}

/* 操作パッドとメッセージ欄の重なり防止：画面が低い端末では縦スクロール */
html,body{min-height:100%;}
#app{height:100dvh;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;}
#world{flex:1 0 auto;min-height:0;justify-content:flex-start;gap:12px;padding:8px 5px 12px;}
#map{flex-shrink:0;width:min(100%,380px);max-height:none;}
#pad{flex-shrink:0;margin:0 auto 4px;position:relative;z-index:1;}
#msg{flex-shrink:0;position:relative;z-index:0;overflow-wrap:anywhere;}
#menu{flex-shrink:0;}
@media(max-height:780px){#map{width:min(100%,300px)}#world{gap:9px}}
@media(max-height:650px){#map{width:min(100%,250px)}#world{gap:8px}#pad{grid-template-rows:repeat(2,40px)}}

/* Battle depth: foreground allies, distant enemies */
#foe{right:1%;top:4%;width:50%;height:51%}
#me{left:0;bottom:0;width:67%;height:63%}
#foe .spr canvas{width:clamp(96px,27vw,148px)!important;height:clamp(96px,27vw,148px)!important}
#me .spr canvas{width:clamp(136px,40vw,195px)!important;height:clamp(136px,40vw,195px)!important;animation:none!important;transform:scaleX(-1)!important}
#foe .spr{filter:brightness(.96)}
#me .spr{filter:drop-shadow(0 10px 7px rgba(0,0,0,.6))}
@media(max-height:690px){#foe .spr canvas{width:110px!important;height:110px!important}#me .spr canvas{width:142px!important;height:142px!important}}
/* 2026-10-23: 味方はdraw()内で既に右向き反転済み。CSSの二重反転を解除 */
#me .spr canvas{transform:none!important;animation:none!important;transform-origin:center center}
/* 敵の足元を地面に近づける（HP欄は動かさない） */
#foe .spr{transform:translateY(27px)}
#foe .spr:after{bottom:2%;width:72%;height:10%;background:#0008}
@media(max-height:690px){#foe .spr{transform:translateY(19px)}}

/* 戦闘演出強化: iPhone Safari対応（CSS animation中心） */
#field{--battle-flash:transparent}
#field.battle-impact{animation:battle-shudder .26s ease-out}
#field.battle-impact:before{content:"";position:absolute;inset:0;background:var(--battle-flash);z-index:3;pointer-events:none;animation:battle-flash .3s ease-out forwards}
#field .spr.attack-lunge{animation:ally-lunge .36s ease-out!important}
#foe .spr.attack-lunge{animation:foe-lunge .36s ease-out!important}
#field .spr.damage-shake{animation:damage-shake .4s ease-in-out!important}
#field .spr.heal-glow{animation:heal-glow .65s ease-out!important}
.damage-number{position:fixed;z-index:99999;pointer-events:none;color:#fff3be;font:bold 25px system-ui,sans-serif;-webkit-text-stroke:1px #3a1920;text-shadow:0 2px 2px #000,0 0 9px #ff803a;animation:damage-float .85s ease-out forwards}
.damage-number.super{color:#ffdb62;font-size:30px;text-shadow:0 0 12px #ff7c27,0 2px 2px #000}
.damage-number.resist{color:#9ad9ff}
@keyframes ally-lunge{0%,100%{transform:translate(0,0)}40%{transform:translate(23px,-16px) scale(1.07)}}
@keyframes foe-lunge{0%,100%{transform:translate(0,0)}40%{transform:translate(-22px,15px) scale(1.08)}}
@keyframes damage-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,2px)}50%{transform:translate(8px,-2px)}75%{transform:translate(-5px,2px)}}
@keyframes damage-float{0%{opacity:0;transform:translate(-50%,5px) scale(.65)}15%{opacity:1;transform:translate(-50%,-12px) scale(1.16)}100%{opacity:0;transform:translate(-50%,-72px) scale(1)}}
@keyframes battle-shudder{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
@keyframes battle-flash{0%{opacity:.7}100%{opacity:0}}
@keyframes heal-glow{50%{filter:drop-shadow(0 0 22px #80ff9c)}}
@media(prefers-reduced-motion:reduce){#field.battle-impact,#field .spr.attack-lunge,#field .spr.damage-shake,#field .spr.heal-glow,.damage-number{animation:none!important}}

/* 操作系を分離: 十字キーと決定/メニューの誤タップ防止 */
#world{gap:12px;padding-bottom:16px}
#pad{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,49px);gap:7px;margin:0 auto;touch-action:none}
#pad button{min-height:49px;font-size:22px;border-radius:12px}
#pad button:nth-child(1){grid-area:1/2}
#pad button:nth-child(2){grid-area:2/1}
#pad button:nth-child(3){grid-area:2/3}
#pad button:nth-child(4){grid-area:3/2}
#exploreActions{display:flex;justify-content:center;gap:22px;width:100%;margin-top:14px;margin-bottom:14px;flex-shrink:0}
#exploreActions button{min-width:112px;min-height:48px;border-radius:12px;background:linear-gradient(#263c55,#0e192b)}
#world~#msg{margin-top:8px}
#world~#menu:not(:empty){margin-top:20px}
@media(max-height:700px){#pad{grid-template-rows:repeat(3,43px)}#pad button{min-height:43px}#exploreActions{margin-top:12px;margin-bottom:12px}}

/* 初回の仲間選択: 3匹を横一列に表示 */
#menu.starter-select{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:none;overflow:visible}
#menu.starter-select button:not(.wide){min-width:0;min-height:132px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:8px 2px;touch-action:manipulation}
#menu.starter-select .starter-portrait{display:flex;justify-content:center;align-items:center;width:100%;height:78px;pointer-events:none}
#menu.starter-select .starter-portrait canvas{width:76px!important;height:76px!important;max-width:100%;animation:none!important}
#menu.starter-select strong{font-size:clamp(11px,3.5vw,15px);white-space:nowrap}
#menu.starter-select small{font-size:11px}
#menu.starter-select .wide{grid-column:1/-1}
</style>
<script>
window.addEventListener('error',function(e){var x=document.getElementById('gameError');if(x){x.style.display='block';x.textContent='起動エラー: '+(e.message||'不明なエラー');}});
window.addEventListener('unhandledrejection',function(e){var x=document.getElementById('gameError');if(x){x.style.display='block';x.textContent='処理エラー: '+String(e.reason||'不明');}});
</script>
</head>
<body>
<div id="gameError" style="display:none;position:fixed;z-index:999999;bottom:0;left:0;right:0;background:#521b20;color:white;padding:12px;font:14px sans-serif;overflow-wrap:anywhere"></div>
<div id="cinema" aria-live="polite"></div>
<div id="app">
<h1>王国の灯 <button id="snd" aria-label="おとの オン・オフ">♪</button></h1><div id="audioControls" style="display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px"><button id="testSound" type="button" style="padding:7px 12px;touch-action:manipulation">♪ 音を出す・テスト</button><span id="audioStatus" aria-live="polite">音が出ない時はこちら</span></div>
<div id="top"></div>
<div id="field"><div id="foe" class="side"></div><div id="me" class="side"></div></div>
<div id="world"><canvas id="map" width="270" height="270"></canvas><div id="pad"><button data-d="0,-1" aria-label="上">▲</button><button data-d="-1,0" aria-label="左">◀</button><button data-d="1,0" aria-label="右">▶</button><button data-d="0,1" aria-label="下">▼</button></div><div id="exploreActions"><button id="abtn" type="button">決定</button><button id="mbtn" type="button">メニュー</button></div></div>
<div id="msg"></div>
<div id="menu"></div>
</div>

function cont(){const s=load();if(!s)return;const f=n=>(n=RN[n]||n,0)||SP.find(x=>x.n==n)||Object.values(EVO).find(x=>x.n==n)||RARE.find(x=>x.n==n)||VOLC.find(x=>x.n==n);party=s.p.map(([n,lv,xp,hp,max,learned])=>({sp:f(n),lv,xp,hp,max,learned:learned||null}));storage=(s.b||[]).map(([n,lv,xp,hp,max,learned])=>({sp:f(n),lv,xp,hp,max,learned:learned||null}));dex=s.d||{};party.forEach(m=>markDex(m.sp.n));party.forEach(m=>{if(!m.learned)m.learned=teach(m)});storage.forEach(m=>{if(!m.learned)m.learned=teach(m)});cur=party[Math.max(0,s.c)];({balls,pot,gold,px,py,met}=s);keys=s.keys||0;shrineClear=!!s.shrineClear;shrineActivated=s.shrineActivated||[];if(shrineClear){const j=NPCS.findIndex(n=>n.b===2);if(j>=0)NPCS.splice(j,1)}if(keys){const i=NPCS.findIndex(n=>n.b);if(i>=0)NPCS.splice(i,1)}curMap='world';MAP=WORLD;goMap()}

function fx(t,el){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,C={fire:['#ff7a1a','#ffd23a','#ff4a1a'],water:['#3d9be0','#8fd0ff','#ffffff'],grass:['#4cc04c','#9ddf5a','#2e8a3a'],electric:['#ffe14a','#fff7a0','#ffffff'],normal:['#ffffff','#dddddd','#aaaaaa'],light:['#fff7b0','#ffffff','#ffe14a'],dark:['#6a3a9a','#2a1a40','#c070ff']}[t]||['#fff','#ddd','#aaa'];
